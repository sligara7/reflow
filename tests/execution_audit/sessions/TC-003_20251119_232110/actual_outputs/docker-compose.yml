version: '3.8'

services:
  payment-service:
    build:
      context: ./services/PaymentService
      dockerfile: Dockerfile
    container_name: payment_service
    ports:
      - "8000:8000"
    environment:
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - EMAIL_SERVICE_URL=http://email-service:8002
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/payments
    depends_on:
      - postgres
    networks:
      - payment-network
    volumes:
      - ./services/PaymentService/src:/app/src

    networks:
      - payment-network
    volumes:

  postgres:
    image: postgres:14
    container_name: payment_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=payments
    ports:
      - "5432:5432"
    networks:
      - payment-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  payment-network:
    driver: bridge

volumes:
  postgres_data:
