# Reflow CI/CD Pipeline
# Runs tests, linting, and security checks on every push

name: CI

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=tools --cov-report=term-missing

    - name: Check test coverage
      run: |
        pytest tests/ --cov=tools --cov-report=xml --cov-fail-under=50
      continue-on-error: true  # Don't fail build if coverage < 50% yet

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy

    - name: Run ruff
      run: ruff check tools/
      continue-on-error: true  # Don't fail build yet

    - name: Run mypy
      run: mypy tools/
      continue-on-error: true  # Don't fail build yet

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit security scan
      run: bandit -r tools/
      continue-on-error: true  # Don't fail build yet

    - name: Run safety dependency check
      run: safety check --file requirements.txt
      continue-on-error: true  # Don't fail build yet

  validate-workflows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install networkx

    - name: Validate all workflow JSON files
      run: |
        python3 tools/validate_workflow_files.py workflows/
